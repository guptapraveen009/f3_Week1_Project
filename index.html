<!DOCTYPE html>
<html>
<head>

<title>Multiple Timers App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h3>Multiple Timers App</h3>

  <div class="row">

  <div id="list"></div>
  <script src="script.js"></script>
